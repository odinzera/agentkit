# agentkit configuration — sourced by agentkit.sh. Command-line flags override these.
# Regenerate interactively with: ./agentkit.sh configure
TARGETS="claude opencode"   # claude opencode codex gemini (space or comma separated) or all
SCOPE="global"              # global | project
PROJECT_DIR=""              # used when SCOPE=project (blank = current dir)
KINDS="skills agents workflows"
ONLY=""                     # blank = everything in the catalog
EXCLUDE=""
WITH=""                     # items marked optional: true to include
LINK_SKILLS=0               # 1 = symlink skills to the catalog so edits go live
